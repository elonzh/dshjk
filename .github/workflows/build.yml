name: Build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testJava: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.testJava }}
            17
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: libs/dshjk-runtime/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --prefix libs/dshjk-runtime --no-audit --no-fund
      - run: ./gradlew build -PtestJavaVersion=${{ matrix.testJava }} --console=plain
        shell: bash
        env:
          DSHJK_TEST_CLI: ${{ github.workspace }}/libs/dshjk-runtime/node_modules/@deepseek-ai/dsh/lib/bin.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-jdk-${{ matrix.testJava }}
          path: |
            libs/*/build/reports/tests/
            examples/spring-boot/build/reports/tests/
