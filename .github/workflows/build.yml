name: Build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, testJava: '17' }
          - { os: ubuntu-latest, testJava: '21' }
          - { os: macos-latest, testJava: '17' }
          - { os: windows-latest, testJava: '17' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.testJava }}
            17
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: infra/dsh-runtime/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --prefix infra/dsh-runtime --no-audit --no-fund
      - run: ./gradlew build -PtestJavaVersion=${{ matrix.testJava }} --console=plain
        shell: bash
        env:
          DSHJK_TEST_CLI: ${{ github.workspace }}/infra/dsh-runtime/node_modules/@deepseek-ai/dsh/lib/bin.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.os }}-${{ matrix.testJava }}
          path: libs/dshjk/build/reports/tests/
